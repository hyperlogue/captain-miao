[package]
name = "cm-payload"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "The reserved-slot payload format, and (feature `build`) the cross-build + injector behind it"

# Two halves, split by who links them.
#
# The **format** (`format.rs`) is the default and has no dependencies at all,
# because both sides need it: the dashboard reads the slot, `xtask` writes it.
# Sharing one module is what keeps the writer and the reader from drifting — the
# alternative was two hand-mirrored parsers, which is exactly the seam that bit
# the staging design this replaced.
#
# The **build** half — cross-compiling `captain-miao-server`, compressing it, and
# injecting it into a linked dashboard — is behind `build` and only `xtask` turns
# it on. That is why the dashboard's dependency here costs it nothing.
[features]
default = []
build = ["dep:flate2", "dep:sha2"]

[dependencies]
# gzip. The dashboard inflates the payload with the same crate, so there is one
# codec in the tree and no C dependency on either side.
flate2 = { version = "1", optional = true }
# The digest that rides to the remote host as the deployed-build marker. Same
# major as cm-core's, so the workspace carries one copy.
sha2 = { version = "0.11", optional = true }
