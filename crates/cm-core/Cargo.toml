[package]
name = "cm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "captain-miao shared core: state, wire protocol, agent backends, launcher, hooks"

# Shared by both binaries (the `miao` dashboard and `miao-server`).
# Deliberately free of ratatui/crossterm (presentation) and libshpool (the pool),
# so it cross-compiles cleanly as part of the server and stays a pure data/logic
# layer. It does carry bundled SQLite (for Codex titles) — portable C, unlike the
# platform-linking libshpool, so it cross-compiles without trouble.
[dependencies]
# `fs` is for `clipboard paste` alone: it streams the image to disk rather than
# buffering up to the 128 MB cap in memory first.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
anyhow = "1"
tracing = "0.1"
# No `env-filter` (see `logging.rs`: `Targets` parses the same RUST_LOG syntax
# without a regex engine) and no `ansi` — both layers set `.with_ansi(false)`,
# since these logs are files, never a terminal.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
dirs = "6"
libc = "0.2"
notify = "8"
toml = "1.1"
# `bundled` statically compiles SQLite into the binary, so reading Codex's
# state_5.sqlite for session renames needs no `sqlite3` CLI at runtime.
# Capped at 0.39 because 0.40 pulls libsqlite3-sys 0.38, whose build script used
# `cfg_select!` while it was still unstable. That blocker is gone as of the 1.97
# toolchain — 0.40.2 checks clean here with no code changes — so what remains is
# an unmade decision, not an obstacle: lifting the cap ships a different bundled
# SQLite, which wants its own test pass rather than riding along with a
# toolchain bump.
rusqlite = { version = "0.39", features = ["bundled"] }

# macOS only, and only for the clipboard bridge: `NSPasteboard` is the sole way
# to get a screenshot's image bytes off the pasteboard (`pbpaste` serves text
# flavours, `osascript` returns hex — see `clipboard/read/macos.rs`). Feature-
# gated down to the four classes we touch so a Linux build pulls none of it and a
# macOS build compiles no AppKit we don't use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSBitmapImageRep", "NSImageRep", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString"] }
