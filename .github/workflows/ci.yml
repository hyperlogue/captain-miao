name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (PR pushes, branch pushes). Scope by
# event too so a push run and a PR run for the same ref don't cancel each other.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# `shell: bash` (vs the unspecified default) adds -o pipefail.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# CI runs every check through `nix develop --command`, so the toolchain
# (rustc/rustfmt/clippy) and build environment (mold+clang on Linux) are the
# exact ones pinned by flake.lock — the same shell a contributor gets from
# `nix develop`. This keeps rustfmt/clippy output in lockstep with local dev and
# was the fix for CI-vs-local fmt drift. GitHub's ubuntu-latest maps to the
# flake's x86_64-linux system and macos-latest to aarch64-darwin.
#
# Third-party actions are pinned to commit SHAs (the trailing comment is the
# tag): a tag can be force-moved to malicious code, a SHA can't.
jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false # nothing here pushes

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Realize the dev shell once and put its Rust bin dir on PATH so
      # Swatinem/rust-cache can read `rustc -vV` for its cache key (it runs
      # outside the nix shell). Later steps still invoke through `nix develop`.
      - name: Put the flake toolchain on PATH
        run: nix develop --command bash -c 'echo "$(dirname "$(command -v rustc)")" >> "$GITHUB_PATH"'

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The flake is the toolchain source for everything that can run nix. The
      # release workflow's dashboard matrix can't (no aarch64-linux system) and
      # reads rust-toolchain.toml instead, and nothing makes the two agree on
      # their own. Assert it here, where the dev shell is already realized: a
      # `nix flake update` that moves the compiler fails until the file moves
      # with it, rather than silently shipping releases built by a rustc that
      # never ran a test.
      - name: Toolchain matches rust-toolchain.toml
        run: |
          pinned=$(awk -F'"' '/^channel/ { print $2 }' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          echo "flake: $actual    rust-toolchain.toml: $pinned"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::flake toolchain is $actual but rust-toolchain.toml pins $pinned" >&2
            exit 1
          fi

      - name: rustfmt
        run: nix develop --command cargo fmt --all --check

      # Two explicit runs rather than `--all-features`. `remote` is the feature
      # that gates real code, so it gets an explicit pass rather than being swept
      # up in a flag whose meaning changes as features are added. Nothing here
      # needs to arrange for the embedded server payloads: those ride an
      # environment variable (CM_SERVER_PAYLOAD_MANIFEST) that CI never sets, so
      # `build.rs` embeds nothing and lints see the ordinary build.
      # Default features only — which now includes `remote`, so one step covers
      # what used to take two. The `--no-default-features` (local-only) build is
      # still expected to compile, but it is not gated here: `REMOTE_ENABLED` is
      # a runtime const rather than `#[cfg]`, so that build compiles the very
      # same code and there is almost nothing for a second lint pass to find.
      - name: clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false # nothing here pushes

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Put the flake toolchain on PATH
        run: nix develop --command bash -c 'echo "$(dirname "$(command -v rustc)")" >> "$GITHUB_PATH"'

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: nix develop --command cargo build --workspace --all-targets --locked

      - name: Test
        run: nix develop --command cargo test --workspace --locked

      # The one `#[ignore]`d test that CI can actually satisfy. It starts a real
      # tmux server on a pid-unique socket with `-f /dev/null`, so it needs
      # nothing but the binary the dev shell now pins — no window system, no
      # display, no consent dialog. That is what separates it from the other
      # backends' live tests, which is why they don't exist.
      #
      # It runs as its own step rather than folded into `--include-ignored`
      # above: `provisions_a_real_host` is also ignored and needs an ssh target
      # and a built server payload, so sweeping them all in would fail here for
      # reasons that have nothing to do with tmux.
      #
      # This pins tmux against whatever version flake.lock resolves, which is
      # *not* the ≥ 3.2 floor the README claims — that floor is still untested.
      - name: Test (live tmux server)
        run: nix develop --command cargo test -p captain-miao --locked -- --ignored drives_a_real_tmux_server
