name: build

# Reusable build matrix used by the release workflow. Compiles an optimized
# binary for every supported macOS / Linux target and uploads each as a tarball
# artifact. captain-miao is Unix-only — it relies on
# Unix-domain sockets, $XDG_RUNTIME_DIR, and caffeinate/systemd-inhibit — and
# Kitty itself has no native Windows build, so there is no Windows target.
#
# The `build` matrix ships ONLY the `captain-miao` dashboard package
# (`-p captain-miao`, whose binary is `miao`), not the whole workspace: the
# dashboard carries the `claude`/`codex`/`hook`/`focus` entrypoints a local
# install needs, and building it alone keeps libshpool (the `miao-server`
# pty pool) off these runners' cross-builds.
#
# `miao-server` is published by the separate `server` job below, on one
# x86_64 runner, cross-compiled to both Linux arches by cargo-zigbuild — which is
# what makes the server a *fetchable* artifact rather than something every
# bundled build has to compile for itself (`cargo xtask dist --from release`).
#
# Linux builds run on **ubuntu-22.04**, not ubuntu-latest, purely to set the glibc
# floor: a binary linked against 24.04's glibc 2.39 dies with a cryptic loader
# error on Debian 12 / RHEL 9 / Ubuntu 22.04. 22.04's glibc 2.35 covers those.
# The npm packages published from these same artifacts inherit that floor, so it
# is a distribution decision, not just a CI one.
on:
  workflow_call:
    inputs:
      version:
        description: Version string baked into the artifact names (e.g. v1.2.3).
        required: true
        type: string

permissions:
  contents: read

# `shell: bash` (vs the unspecified default) adds -o pipefail.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to commit SHAs (the trailing comment is the
# tag): a tag can be force-moved to malicious code, a SHA can't.
#
# No `run:` block below interpolates a `${{ }}` expression into its script body;
# values reach the shell through `env:` instead. Expressions are substituted into
# the script *text* before bash parses it, so an input carrying `$( )`, a
# backtick, or `;` would become executable code rather than a string — and
# `inputs.version` is a git tag, which git happily allows all three in.
# release.yml also pins the tag to plain SemVer before calling this workflow;
# the indirection here is what keeps that true for any other caller.
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `native` marks a target whose binary runs on its own runner, so the
          # smoke test can exec it. Both Linux targets build on their own arch
          # (GitHub's arm64 runners are free for public repos), which both drops
          # the gcc cross toolchain bundled SQLite would otherwise need and makes
          # the aarch64 binary testable instead of shipping unexecuted. Only
          # x86_64 macOS is still cross-built — macos-latest is arm64, and Apple
          # ships both SDKs, so that cross is native-toolchain and reliable.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false # nothing here pushes

      # This matrix is the one build in the project that cannot use the flake —
      # it runs on aarch64-linux, which the flake has no system for — so it
      # installs its own compiler and needs to be told which. It reads the pin
      # rather than tracking `stable`: on the rolling channel the *published*
      # binaries were compiled by whatever rustc landed that morning, a version
      # no lint or test job had ever run. ci.yml asserts this file agrees with
      # the flake, so the two halves of a release share one compiler.
      #
      # Plain awk — no toolchain exists yet at this point, which is the same
      # reason release.yml's verify job greps the version out of Cargo.toml.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ { print $2 }' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "::error::no channel found in rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      # Pinned to master (a moving branch, so it can't be a version tag); the
      # version it installs is set explicitly via `toolchain:` since the ref no
      # longer names it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p captain-miao

      # `--version` is handled by clap at parse time (exit 0) before the
      # terminal gate, so it's a safe exit-0 probe that the binary at least
      # links and runs. Only on natively-runnable targets.
      - name: Smoke-test the binary
        if: matrix.native
        run: ./target/"$TARGET"/release/miao --version

      - name: Package
        run: |
          set -euo pipefail
          # The tarball is named for the project; the binary inside it is `miao`
          # (see the [[bin]] target in Cargo.toml). stage-npm-packages.sh reads
          # both halves of that split — keep them in sync with its PROJECT/BIN.
          name="captain-miao-$VERSION-$TARGET"
          stage="dist/$name"
          mkdir -p "$stage"
          cp "target/$TARGET/release/miao" "$stage/"
          # README + LICENSE only. CLAUDE.md is `@AGENTS.md` plus agent tooling
          # tips — an import that would dangle here, and not user-facing docs.
          cp README.md LICENSE "$stage/"
          tar -C dist -czf "$name.tar.gz" "$name"

      # No .sha256 sidecar: GitHub already hashes this twice over. upload-artifact
      # records a SHA-256 digest that download-artifact verifies on the way back
      # out, and a release asset carries a `digest: "sha256:…"` field in the REST
      # API — so a sidecar would be a third copy of the same number, trusted no
      # more than the tarball beside it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captain-miao-${{ matrix.target }}
          path: captain-miao-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The per-host daemon a dashboard deploys to a remote box. Published as its own
  # release asset so obtaining a server is decoupled from building a dashboard:
  # `cargo xtask dist --from release` downloads these instead of cross-building
  # them, which is what lets a bundled dashboard be built with no cross toolchain
  # at all — just curl and tar.
  #
  # ONE x86_64 runner for every target, deliberately. cargo-zigbuild cross-compiles
  # bundled SQLite's C amalgamation without a distro cross toolchain, and — the
  # reason it is used even for the runner's own arch — it pins the glibc floor at
  # xtask's server::GLIBC_FLOOR (2.28, Debian 10 / RHEL 8). A native build would
  # link against the runner's glibc instead and die on the loader of any older
  # server, which is precisely the fleet this binary exists to reach. The nix dev
  # shell is where zig and the cross rust-stds come from; the flake covers
  # x86_64-linux but not aarch64-linux, so the arm64 runner is not an option here
  # even if we wanted one.
  #
  # FOUR targets, not two: the gnu pair plus a static-musl pair. Nothing embeds
  # the musl builds — a released dashboard stays gnu-only, since musl's audience
  # is hosts with no generic loader and those are better served by a server built
  # against their own libc. They are published so a dashboard that *meets* such a
  # host can fetch one at runtime, which is the only way a released binary reaches
  # a NixOS/Alpine/distroless box at all. Publishing is what makes a payload
  # reachable without carrying it; see xtask's PUBLISHED_TARGETS vs LINUX_TARGETS.
  #
  # The target list lives in xtask, not here: this job runs `cargo xtask
  # prepare-servers` bare and packages whatever lands in dist/servers/, so adding
  # a target is a one-line change there and this workflow needs no edit. That is
  # also the same code path a developer runs locally, so the strategy choice, the
  # floor, and the ELF architecture check cannot drift between what CI publishes
  # and what a laptop builds.
  server:
    name: miao-server (linux payloads)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false # nothing here pushes

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Realize the dev shell once and put its Rust bin dir on PATH so
      # Swatinem/rust-cache can read `rustc -vV` for its cache key (it runs
      # outside the nix shell). The build itself still goes through `nix develop`.
      - name: Put the flake toolchain on PATH
        run: nix develop --command bash -c 'echo "$(dirname "$(command -v rustc)")" >> "$GITHUB_PATH"'

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: server-payloads

      - name: Cross-build the servers
        run: nix develop --command cargo xtask prepare-servers --out dist/servers

      # Flat tarballs — one binary, no wrapper directory and no README. These are
      # a machine-consumed artifact: xtask's `server::fetch` extracts the single
      # member `miao-server` by name, which is also what stops a crafted
      # archive writing anywhere else. The file name is the other half of that
      # contract; `release_url` builds exactly this string, pinned by a unit test.
      - name: Package
        run: |
          set -euo pipefail
          for dir in dist/servers/*/; do
            target=$(basename "$dir")
            tar -C "$dir" -czf "miao-server-$VERSION-$target.tar.gz" miao-server
            echo "  packaged miao-server-$VERSION-$target.tar.gz"
          done

      # Two different names, and both matter. The *artifact* keeps the
      # `captain-miao-` prefix because the release job selects artifacts with
      # `pattern: captain-miao-*`; rename it and the servers silently stop being
      # published. The *files* inside are `miao-server-v<version>-<target>.tar.gz`,
      # which `release_url` reconstructs (pinned by a unit test) and which
      # `stage-npm-packages.sh` cannot pick up — it looks for the exact name
      # `captain-miao-v<version>-<target>`, so a server tarball can never be
      # mistaken for a dashboard one and staged into an npm package.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captain-miao-server-payloads
          path: miao-server-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The *bundled* Linux dashboard: the same `miao`, carrying `miao-server` for
  # both Linux arches so it can deploy one to a host that has none. Published
  # beside the plain build rather than replacing it — most users run captain-miao
  # locally and shouldn't pay ~7 MB for a code path they never reach — so a
  # release offers both and you pick.
  #
  # `needs: server` and `--server <target>=<path>`, not `--from release`: the
  # servers this bundles are the ones *this* run just built, which are not
  # published yet (the release job publishes them afterwards). Handing xtask the
  # exact binaries is the documented escape hatch for precisely this case, and it
  # keeps the bundle and the standalone server assets bit-identical rather than
  # merely same-versioned.
  #
  # Only Linux: LINUX_TARGETS is what a bundle can carry, and a macOS dashboard
  # deploying to Linux hosts is a real case but not one this job covers yet —
  # `cargo xtask dist --variant bundle-linux --from release` builds it locally.
  bundle:
    name: bundled dashboard (${{ matrix.target }})
    needs: server
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Same toolchain source as the build matrix above, and for the same reason:
      # these runners can't use the flake (no aarch64-linux system in it), so the
      # pin in rust-toolchain.toml is what keeps them on the tested compiler.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/ { print $2 }' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "::error::no channel found in rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: bundle-${{ matrix.target }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: captain-miao-server-payloads
          path: servers

      # Flat tarballs holding a single `miao-server`, so each unpacks into its
      # own directory named for its target.
      - name: Unpack the servers
        run: |
          set -euo pipefail
          for tgz in servers/miao-server-*.tar.gz; do
            base=${tgz##*/}
            target=${base#"miao-server-$VERSION-"}
            target=${target%.tar.gz}
            mkdir -p "servers/$target"
            tar -C "servers/$target" -xzf "$tgz" miao-server
          done
          ls -R servers

      - name: Build the bundle
        run: |
          set -euo pipefail
          cargo xtask dist --variant bundle-linux \
            --server "x86_64-unknown-linux-gnu=$PWD/servers/x86_64-unknown-linux-gnu/miao-server" \
            --server "aarch64-unknown-linux-gnu=$PWD/servers/aarch64-unknown-linux-gnu/miao-server"

      # `dist` already verifies the artifact reports the servers it was built to
      # carry; this repeats it in the log so a bundle that silently carried
      # nothing is visible in the run rather than only in an exit code.
      - name: Show what it carries
        run: ./dist/miao-bundle-linux --version

      - name: Package
        run: |
          set -euo pipefail
          # `miao-bundle-`, NOT `captain-miao-`: stage-npm-packages.sh resolves
          # dashboard tarballs by the exact name `captain-miao-v$VERSION-$target`,
          # and an npm package must carry the plain build. Same split the server
          # tarballs use, for the same reason.
          name="miao-bundle-$VERSION-$TARGET"
          stage="dist/$name"
          mkdir -p "$stage"
          cp dist/miao-bundle-linux "$stage/miao"
          cp README.md LICENSE "$stage/"
          tar -C dist -czf "$name.tar.gz" "$name"

      # Artifact name keeps the `captain-miao-` prefix so the release job's
      # `pattern: captain-miao-*` collects it; the files inside cannot be
      # mistaken for the npm-staged ones (see Package above).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captain-miao-bundle-${{ matrix.target }}
          path: miao-bundle-*.tar.gz
          if-no-files-found: error
          retention-days: 7
