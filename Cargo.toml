[workspace]
members = ["crates/cm-core", "crates/cm-server", "crates/cm-client", "crates/cm-payload", "xtask"]

# Metadata every member inherits with `<key>.workspace = true`, so the version,
# license, and repo URL can't drift between the four packages.
[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/hyperlogue/captain-miao"
# 1.88 is the real floor: ratatui 0.30 declares it, and `logo.rs` uses
# `u32::is_multiple_of` (stable 1.87). Edition 2024 alone would only need 1.85.
rust-version = "1.88"

[package]
name = "captain-miao"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "TUI dashboard to monitor and manage multiple Claude Code and Codex sessions in Kitty or zellij"

# The package is `captain-miao` (the project's name, and the npm/crate identity)
# but the executable it installs is `miao` — a dashboard you reach for dozens of
# times a day should be two keystrokes. Naming the target explicitly is what
# decouples the two; without it cargo derives the binary name from the package.
[[bin]]
name = "miao"
path = "src/main.rs"

# The `captain-miao` dashboard: the ratatui TUI client. It never hosts a pty pool
# (no libshpool) — the per-host daemon that does is the separate
# `miao-server` binary (crates/cm-server), which cross-compiles to Linux.
# Shared logic (state, protocol, agents, launcher, hooks) lives in `cm-core`.
[dependencies]
cm-core = { path = "crates/cm-core" }
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
libc = "0.2"
notify = "8"
toml = "1.1"
unicode-width = "0.2"
emojis = "0.6"
# Encodes raw-RGBA image payloads into kitty graphics-protocol escapes for the
# header paw + cat. Already in the tree transitively; pinned here as a direct dep.
base64 = "0.22"
# Inflates the embedded `miao-server` payloads before uploading them to a
# remote host (src/server_payload.rs). Pure Rust (miniz_oxide) by default, and
# the same crate `xtask` compresses with, so there is one codec in the tree and
# no C dependency on either side.
flate2 = "1"
# The reserved-slot format, shared with the injector in `xtask` so the writer and
# the reader can't drift. Default features only, which is the dependency-free
# format module — the cross-build half is behind its `build` feature.
cm-payload = { path = "crates/cm-payload" }

[features]
default = []
# Remote (SSH) hosts — the federated multi-host dashboard (docs/remote-sessions.md).
# **Work in progress**, so it is OFF by default: the full lifecycle is implemented
# but has not been verified end-to-end against a real remote host, and restart /
# fork are still local-only. The gate is deliberately a *runtime* const
# (`app::REMOTE_ENABLED`) rather than `#[cfg]` on ~240 references across the
# dashboard: the same code compiles either way (so both configurations stay
# type-checked, clippy-clean, and covered by the same tests), and with the
# feature off the dashboard simply never reads `hosts.json` and never constructs
# a `Backend::Remote`, leaving it local-only.
remote = []

# Reserve room for `captain-miao-server` builds, so the dashboard can deploy one
# to a remote host that hasn't got it (docs/crate-split.md).
#
# The feature reserves the space and compiles the reader; `cargo xtask dist`
# cross-builds the servers and writes them into the reservation **after
# linking**. So this is not "which servers does it carry" — that is chosen at
# bundling time, and one build serves every architecture combination. It is only
# "can it carry any", which is why there is one feature here rather than one per
# arch, and why turning it on needs no cross toolchain.
#
# How much room comes from `CM_PAYLOAD_RESERVE` (see `build.rs`), which `xtask`
# sets from the size of the servers it just compressed. Unset means a zero-length
# slot: the build succeeds and honestly reports carrying nothing.
#
# Implies `remote`: a bundled server is only reachable through the remote-host
# path, so a bundle without it would be dead weight by construction.
bundle = ["remote"]

# Dev-only: the logo/cat alpha-mask assets are generated once by
# `examples/gen_logo_assets` (pure-Rust 2D rasteriser) and committed under
# `assets/logo/`. tiny-skia never ships in the dashboard binary — the runtime only
# embeds the finished `.gray` masks (the `.png` outputs are eyeball previews).
[dev-dependencies]
tiny-skia = "0.11"

[profile.release]
# Strip symbols from the release binary (~0.9 MB smaller); we ship the binary,
# not a debugger target. Safe alongside the payload slot, which is allocated data
# rather than a symbol or a trailing blob and so survives stripping — that is the
# property the whole bundling design is built on.
strip = true
# Measured 16% off `miao-server` (8.61 → 7.21 MB) and the same order off
# `miao`, which every npm and GitHub download pays for, and which a bundled build
# pays for twice over since it carries a server as well. Costs ~90s of build time
# on a release build; debug builds are untouched.
#
# Deliberately NOT `panic = "abort"`, the usual companion: the server is a daemon
# hosting the pty pool, so unwinding drops one task where aborting would kill
# every session on the host. Not worth a few percent.
lto = "fat"
codegen-units = 1
