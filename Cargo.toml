[workspace]
members = ["crates/cm-core", "crates/cm-server", "crates/cm-client", "xtask"]

# Metadata every member inherits with `<key>.workspace = true`, so the version,
# license, and repo URL can't drift between the four packages.
[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hyperlogue/captain-miao"
# 1.88 is the real floor: ratatui 0.30 declares it, and `logo.rs` uses
# `u32::is_multiple_of` (stable 1.87). Edition 2024 alone would only need 1.85.
rust-version = "1.88"

[package]
name = "captain-miao"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "TUI dashboard to monitor and manage multiple Claude Code and Codex sessions in Kitty or zellij"

# The package is `captain-miao` (the project's name, and the npm/crate identity)
# but the executable it installs is `miao` — a dashboard you reach for dozens of
# times a day should be two keystrokes. Naming the target explicitly is what
# decouples the two; without it cargo derives the binary name from the package.
[[bin]]
name = "miao"
path = "src/main.rs"

# The `captain-miao` dashboard: the ratatui TUI client. It never hosts a pty pool
# (no libshpool) — the per-host daemon that does is the separate
# `miao-server` binary (crates/cm-server), which cross-compiles to Linux.
# Shared logic (state, protocol, agents, launcher, hooks) lives in `cm-core`.
[dependencies]
cm-core = { path = "crates/cm-core" }
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
# `color` is off: colourising `--help` costs six crates (anstream, anstyle-parse,
# utf8parse, anstyle-query, colorchoice, is_terminal_polyfill) of terminal
# detection, for five subcommands nobody reads twice. `suggestions` stays — a
# typo'd subcommand earning a "did you mean" costs only strsim.
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
tracing = "0.1"
dirs = "6"
libc = "0.2"
notify = "8"
toml = "1.1"
unicode-width = "0.2"
emojis = "0.6"
# Encodes raw-RGBA image payloads into kitty graphics-protocol escapes for the
# header paw + cat. Already in the tree transitively; pinned here as a direct dep.
base64 = "0.22"
# Inflates the embedded `miao-server` payloads before uploading them to a
# remote host (src/server_payload.rs), and the ones downloaded from a release.
#
# **Decode only, and pure Rust on purpose.** The dashboard cross-compiles to four
# targets and must not grow a C dependency for this; `lzma-rs` needs no system
# liblzma and no build script. `xtask` compresses with the C liblzma instead
# (see its Cargo.toml) — the asymmetry is deliberate, because this crate's
# *encoder* does not actually compress: measured, `xz_compress` turned a
# 4,711,104-byte server into 4,711,376 bytes. Its decoder is fine, and verified
# against liblzma's output by a round-trip test.
#
# Measured against `flate2`, which this replaced: +25 KiB of decoder in exchange
# for 462 KiB less payload per embedded server.
lzma-rs = "0.3"
# Digests a server payload that came from a file rather than the embedded table
# (the env-var and cache sources), so every candidate carries the same identity
# the deploy marker records. Already in the tree via `cm-core` and `xtask`, and
# pinned to the same major, so this adds no compile.
sha2 = "0.11"

[features]
default = ["remote"]
# Remote (SSH) hosts — the federated multi-host dashboard (docs/remote-sessions.md).
# ON by default since 0.3.0: it has been verified against real hosts. The flag is
# kept so a build can still opt out (`--no-default-features`) and be strictly
# local-only. The gate is deliberately a *runtime* const (`app::REMOTE_ENABLED`)
# rather than `#[cfg]` on ~240 references across the dashboard: the same code
# compiles either way, and with the feature off the dashboard simply never reads
# `hosts.json` and never constructs a `Backend::Remote`. CI lints and tests the
# default (feature-on) build only — with the gate being a runtime const there is
# essentially nothing a second pass could find that the first doesn't.
remote = []

# Dev-only: the logo/cat alpha-mask assets are generated once by
# `examples/gen_logo_assets` (pure-Rust 2D rasteriser) and committed under
# `assets/logo/`. tiny-skia never ships in the dashboard binary — the runtime only
# embeds the finished `.gray` masks (the `.png` outputs are eyeball previews).
[dev-dependencies]
tiny-skia = "0.11"

[profile.release]
# Strip symbols from the release binary (~0.9 MB smaller); we ship the binary,
# not a debugger target. Safe alongside the embedded server payloads: an
# `include_bytes!` static is allocated, referenced data rather than a symbol or a
# trailing blob, so `strip` cannot drop it without breaking the program.
strip = true
# Measured 16% off `miao-server` (8.61 → 7.21 MB) and the same order off
# `miao`, which every npm and GitHub download pays for, and which a bundled build
# pays for twice over since it carries a server as well. Costs ~90s of build time
# on a release build; debug builds are untouched.
#
# Deliberately NOT `panic = "abort"`, the usual companion: the server is a daemon
# hosting the pty pool, so unwinding drops one task where aborting would kill
# every session on the host. Not worth a few percent.
lto = "fat"
codegen-units = 1

# What `miao-server` is built with — `xtask`'s `server::build`, never a bare
# `cargo build`. Separate from `[profile.release]` on purpose: the dashboard is
# an interactive TUI on the machine you are sitting at, and has no reason to
# trade throughput for bytes. The server is a payload, and every published
# dashboard carries one, so its size is paid by every npm install and every
# GitHub download.
#
# All figures below are measured on a native x86-64 build and **gzipped**,
# against a 3,075,415-byte baseline of this same profile at `opt-level = 3`.
# Gzip because that is what the payload shipped in when these were taken; it
# ships xz now (see `lzma-rs` above), which compounds with this rather than
# replacing it — the ratios here still hold, the absolute bytes are no longer
# what lands in a release.
#
# This profile, with the overrides and the SQLite trim `xtask` sets alongside it:
# 2,154,035 (-30.0%). On the real zigbuild cross-build CI publishes from, the
# x86-64 glibc payload goes 2,975,483 -> 2,137,645 (-28.2%).
#
# `opt-level = "s"` rather than `"z"`: `"s"` here is -23.0% before the SQLite
# trim, where a separate `"z"` run measured about -29%. The extra ~6 points is
# not worth an unmeasured throughput risk on a daemon — `"z"` disables loop
# vectorization outright, `"s"` keeps it. Nobody has benchmarked either against
# `3`, so the conservative one wins by default; revisit only with numbers.
#
# The overrides hold the pty byte path at full speed: shpool-vterm's vte state
# machine sees *every byte* of terminal output from *every* session on the host,
# and tokio drives the sockets around it. They cost ~34 KiB gzipped, against a
# slowdown nobody has quantified. Both `vte` majors in the graph are covered — an
# unversioned key applies to every version of a name.
#
# Considered and not taken: leaving Rust at `3` and dropping only
# `libsqlite3-sys` to `"s"` is -9.6% on its own, or -16.6% with the trim — 55% of
# the full win for zero effect on any Rust code. Worth remembering as the
# fallback if `"s"` ever proves to cost real throughput.
#
# Note this level reaches C, not just Rust: `cc` scrapes cargo's `OPT_LEVEL` and
# passes it through as `-O<level>` (cc-1.2.65 `src/lib.rs:2123`), so SQLite's
# bundled amalgamation compiles `-Os` here.
[profile.server-release]
inherits = "release"
opt-level = "s"

[profile.server-release.package.shpool-vterm]
opt-level = 3
[profile.server-release.package.shpool_vt100]
opt-level = 3
[profile.server-release.package.vte]
opt-level = 3
[profile.server-release.package.tokio]
opt-level = 3
